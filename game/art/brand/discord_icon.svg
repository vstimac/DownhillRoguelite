<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="62%">
      <stop offset="0" stop-color="#3a120a"/>
      <stop offset="0.55" stop-color="#140806"/>
      <stop offset="1" stop-color="#040202"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.35" stop-color="#e8b955"/>
      <stop offset="0.7" stop-color="#b07a2a"/>
      <stop offset="1" stop-color="#6e4614"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5018"/>
      <stop offset="0.5" stop-color="#d9a648"/>
      <stop offset="1" stop-color="#7a5018"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc8f"/>
      <stop offset="0.5" stop-color="#9c6a22"/>
      <stop offset="1" stop-color="#f0cc78"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.25" stop-color="#ffd166"/>
      <stop offset="0.6" stop-color="#ff6a1a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff3c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a2a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3c00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="600" r="330" fill="url(#glow)"/>

  <!-- frame -->
  <circle cx="512" cy="512" r="476" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <circle cx="512" cy="512" r="452" fill="none" stroke="#c9963f" stroke-opacity="0.55" stroke-width="3"/>

  <!-- the summit -->
  <polygon points="512,150 712,452 312,452" fill="url(#gold)"/>
  <polygon points="512,150 712,452 512,452" fill="#000" fill-opacity="0.22"/>
  <polygon points="512,150 566,232 538,222 512,252 486,224 458,232" fill="#fff6dc"/>

  <!-- nine circles, stepping down into the pit -->
  <g fill="url(#goldSide)">
    <rect x="292" y="476" width="440" height="26" rx="4"/>
    <rect x="318" y="514" width="388" height="25" rx="4"/>
    <rect x="344" y="551" width="336" height="24" rx="4"/>
    <rect x="369" y="587" width="286" height="23" rx="4"/>
    <rect x="393" y="622" width="238" height="22" rx="4"/>
    <rect x="416" y="656" width="192" height="21" rx="4"/>
    <rect x="438" y="689" width="148" height="20" rx="4"/>
    <rect x="459" y="721" width="106" height="19" rx="4"/>
    <rect x="478" y="752" width="68" height="18" rx="4"/>
  </g>

  <!-- the light below that is never reached -->
  <circle cx="512" cy="818" r="70" fill="url(#ember)"/>
  <circle cx="512" cy="818" r="11" fill="#fffbe6"/>
</svg>
